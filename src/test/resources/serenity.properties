# WebDriver Configuration
webdriver.driver=chrome

webdriver.autodownload=true

# Chrome Options - Alternative syntax
chrome.switches=--remote-allow-origins=*;--disable-web-security;--window-size=1920,1080;--no-sandbox;--disable-dev-shm-usage;--disable-save-password-bubble;--disable-notifications;
# Disable password save popup
chrome_preferences.credentials_enable_service=false
chrome_preferences.profile.password_manager_enabled=false
chrome_preferences.profile.password_manager_leak_detection=false




#--headless=new;

# Maximize Browser Window

serenity.browser.maximized=true

# Restart  the browser between  scenarios
restart.browser.each.scenario=true

# Screenshots
serenity.take.screenshots=AFTER_EACH_STEP

# Timeouts
webdriver.timeouts.implicitlywait=10000
webdriver.wait.for.timeout=15000

# Report Configuration
serenity.project.name=Automation Exercise with Serenity
serenity.test.root=com.sparta
